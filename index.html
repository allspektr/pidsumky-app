<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Підсумки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@600&display=swap">
<style>
:root{
  --bg:var(--tg-theme-secondary-bg-color,#EEF3F1); --card:var(--tg-theme-bg-color,#fff); --ink:var(--tg-theme-text-color,#13201B);
  --muted:var(--tg-theme-hint-color,#5C6E67); --accent:var(--tg-theme-button-color,#0B7F62); --accent-ink:var(--tg-theme-button-text-color,#fff);
  --line:color-mix(in srgb,var(--muted) 22%,transparent); --soft:color-mix(in srgb,var(--accent) 14%,transparent);
  --coin:#C98A00; --coin-soft:color-mix(in srgb,#E0A21B 18%,transparent); --bad:#C2462F;
  --f-d:"Unbounded","Manrope",system-ui,sans-serif; --f-b:"Manrope",system-ui,-apple-system,sans-serif; --f-m:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-b);padding:12px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2{font-family:var(--f-d);margin:0;letter-spacing:-.01em} h1{font-size:20px} h2{font-size:15px}
.card{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.num{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:7px;transition:width .6s}
.bar s{position:absolute;top:0;bottom:0;width:2px;background:var(--card)}
.big{font-family:var(--f-d);font-size:30px;color:var(--coin)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.seg button{font:700 14px var(--f-b);border:0;border-radius:10px;padding:10px;background:none;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.item{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--bg);border:0;text-align:left;font:inherit;color:inherit;width:100%}
.item .box{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--card);border:2px solid var(--line)}
.item.ok .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item.no .box{border-color:var(--bad);color:var(--bad)}
.item .t{font-weight:800} .item .s{font-size:12.5px;color:var(--muted)}
.item[disabled]{cursor:default} button.item:not([disabled]){cursor:pointer}
.rw{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:700 12px var(--f-b);vertical-align:2px}.pick{display:flex;gap:6px;margin-top:8px}.pick button{font:700 13px var(--f-b);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px}.pick button:disabled{opacity:.75}.pick button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cta{font:800 15px var(--f-b);border:0;border-radius:14px;padding:14px;background:var(--accent);color:var(--accent-ink);width:100%}
.lines .l{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.lines .l:last-child{border:0} .lines .v{font-family:var(--f-m)}
.streak{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.streak div{border-radius:12px;padding:8px;text-align:center;background:var(--bg);font-size:11px;color:var(--muted)}
.streak div b{display:block;font-family:var(--f-m);color:var(--coin);font-size:13px}
.streak div.on{background:var(--coin-soft)}
.wk{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px} .wk .v{font-family:var(--f-m);text-align:right}
.full{color:var(--coin);font-weight:800}
.empty{padding:24px;text-align:center;color:var(--muted)}
.kidsw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kidsw button{font:inherit;color:inherit;text-align:left;border:2px solid transparent;background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.kidsw button[aria-pressed=true]{border-color:var(--accent)}
.kidsw b{font-family:var(--f-d);font-size:16px} .kidsw span{font-size:12.5px;color:var(--muted)}
.days{display:grid;grid-template-columns:24px repeat(7,1fr) 24px;gap:4px;align-items:center}
.days button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:700;min-width:0}
.days button.arrow{border:0;background:none;font-size:18px;color:var(--muted)}
.days button[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}
.days button:disabled{opacity:.35}
.days small{font-family:var(--f-m);font-size:10px;color:var(--muted)}
.days .full small{color:var(--accent)}
.note{background:var(--soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700}
.nrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.nrow:last-child{border:0}.nrow .tx{min-width:0;overflow-wrap:anywhere;font-size:14px}
.nrow .k{display:block;font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
input.why{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
select.why{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;-webkit-appearance:none;appearance:none}
.ghost{font:700 14px var(--f-b);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;width:100%}
.banner{background:var(--coin-soft);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner button{font:700 13px var(--f-b);border:0;background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px}
.err{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border-radius:14px;padding:12px}
.sub{font-size:12.5px;color:var(--muted);margin-top:-4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{font:700 13px var(--f-b);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px}.chips button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fix{font:700 12px var(--f-b);border:0;background:none;color:var(--accent);padding:4px 0;text-decoration:underline}
textarea.why{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:72px;resize:vertical}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal .card{width:100%;max-width:520px;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0}
.pr{border-left:3px solid var(--line);padding:6px 10px;margin:4px 0;font-size:14px}.pr b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.pr.kid{border-color:var(--accent)}
.stat{font-size:14px;font-weight:700}.stat.ok{color:var(--accent)}.stat.no{color:var(--bad)}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,30px);gap:3px;align-items:center;font-size:12.5px}
.grid .hd{font-family:var(--f-m);font-size:10px;color:var(--muted);text-align:center}
.grid .nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:4px}
.grid button,.grid .c{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);font:700 13px var(--f-b);color:var(--ink);display:grid;place-items:center;padding:0}
.grid .ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.grid .no{color:var(--bad);border-color:var(--bad)}.grid .none{background:var(--coin-soft)}.grid .opt{opacity:.55}.grid .c{opacity:.35;border-style:dashed}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card empty">Завантажую…</div></div>
<script>
const API = 'https://jghlyjhpqherweplohrl.supabase.co/functions/v1/family-bot';
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const Q = new URLSearchParams(location.search), HASH = (location.hash || '').slice(1);
let state = null, date = /^\d{4}-\d{2}-\d{2}$/.test(Q.get('d')||'') ? Q.get('d') : null, pkid = Q.get('k') || 'vlad', preview = false, busy = false;
let reviewMode = HASH === 'review', reviewWeek = /^\d{4}-\d{2}-\d{2}$/.test(Q.get('w')||'') ? Q.get('w') : '';
const uah = n => Math.round(n).toLocaleString('uk-UA') + ' ₴';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mins = s => { const m = Math.round(s/60); return m >= 60 ? Math.floor(m/60)+' год '+(m%60)+' хв' : m+' хв'; };
const addD = (d, n) => { const x = new Date(d+'T12:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };
const DN = ['нд','пн','вт','ср','чт','пт','сб'];
const shortD = d => { const x = new Date(d+'T12:00:00Z'); return DN[x.getUTCDay()]+' '+x.getUTCDate()+'.'+String(x.getUTCMonth()+1).padStart(2,'0'); };
const ICON = {auto:'☀️', self:'', timed:'📚', screen:'🎮', parent:'🌙'};

let toast = ''; // коротке повідомлення над екраном (напр. про обрив зв'язку)
let diag = null;  // що сталося з попереднім обірваним запитом — сервер запише в лог
const drafts = {}; // чернетки похвали за дитиною: не губляться, якщо збереження не пройшло
// дії, які безпечно повторити (результат той самий, скільки разів не надішли)
const BUILD = '18'; // має збігатися з ?v= у fb_config.app_url; інакше сторінка сама перезавантажиться
const SAFE = new Set(['app_state','app_p_praise','app_p_toggle','app_toggle','app_screen','app_p_news','app_p_chore_price','app_p_task_ok','app_p_habit_day','app_p_task_credit']);
let lastAction = '';
async function call(action, extra={}) {
  lastAction = action;
  if (!tg || !tg.initData) { render({error:'Відкрийте цю сторінку з бота @Pidsumky_bot.'}); return; }
  busy = true; document.body.style.cursor = 'progress';
  // таймаут 20 с: завислий запит на телефоні не має блокувати сторінку назавжди
  const send = () => { const body = JSON.stringify({action, date, kid:pkid, ...(reviewWeek && !date ? {week: reviewWeek} : {}), ...extra, ...(diag ? {diag} : {})}); const ac = new AbortController(); const t = setTimeout(() => ac.abort(), 20000); return fetch(API, {method:'POST', headers:{'content-type':'application/json','x-tg-init-data':tg.initData}, body, signal: ac.signal}).finally(() => clearTimeout(t)); };
  let r = null, j = null;
  for (let attempt = 0; attempt < 3 && !r; attempt++) {
    try { r = await send(); j = await r.json(); diag = null; }
    catch(e) {
      r = null;
      diag = {err: String(e && e.message || e).slice(0, 120), act: action, try: attempt + 1, at: new Date().toISOString()};
      // небезпечну дію не повторюємо (могла вже зберегтися) — лише перечитуємо стан
      if (!SAFE.has(action)) { action = 'app_state'; extra = {}; }
      await new Promise(res => setTimeout(res, 1200 * (attempt + 1)));
    }
  }
  busy = false; document.body.style.cursor = '';
  if (!r) {
    // екран не стираємо: показуємо останній стан і підказку
    if (state) { toast = 'Немає звʼязку із сервером. Спробуйте ще раз — набране не загубилось.'; render(state); }
    else render({error:'Немає звʼязку із сервером. Перевірте інтернет.'});
    return;
  }
  if (!r.ok) { render({error: j && j.error==='not_member' ? 'Спершу підключіться до бота за посиланням-запрошенням.' : 'Не вдалося завантажити. Спробуйте ще раз.'}); return; }
  // до 05:00 сервер віддає дитині вчорашній вечір, тож дату беремо з відповіді
  // стара копія сторінки (кеш Telegram) — перезавантажити один раз на актуальну версію
  const appV = j.role === 'parent' ? (j.detail||{}).appV : j.appV;
  if (appV && appV !== BUILD) { let done = false; try { done = sessionStorage.getItem('reloaded') === appV; sessionStorage.setItem('reloaded', appV); } catch(e) {} if (!done) { location.replace(location.pathname + '?v=' + appV); return; } }
  state = j; if (!date) date = j.role==='parent' ? j.detail.date : j.date;
  taskNote = j.role === 'parent' && /^app_p_(task|chore)/.test(lastAction) ? (j.note || '') : '';
  if (j.role === 'parent') { const my = (j.detail.praise||{})[j.pkey]; if (my && drafts[j.detail.kid] === my.why) delete drafts[j.detail.kid]; }
  render(j);
  if (HASH && !scrolledOnce) { scrolledOnce = true; const el = document.getElementById('blk-' + HASH); if (el) { if (el.tagName === 'DETAILS') el.open = true; el.scrollIntoView({block:'start'}); } }
}
let scrolledOnce = false;

function goalCard(k) {
  const p = k.piggy;
  if (!p.goal) return `<section class="card"><div class="row"><div class="lbl">💰 Скарбничка</div><span class="big" style="font-size:22px">${uah(p.bal)}</span></div></section>`;
  const tot = p.total ?? p.bal, pct = Math.min(100, tot/p.goal*100), left = Math.max(0, p.goal - tot);
  const eta = left===0 ? 'Ціль досягнута! 🎉' : p.avg > 0 ? '≈ '+Math.ceil(left/p.avg)+' тиж.' : '';
  return `<section class="card" style="gap:6px"><div class="row"><div><div class="lbl">🎯 ${esc(p.goal_name||'Ціль')}</div></div><div class="num" style="font-size:20px;font-weight:600">${uah(p.bal)}</div></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="row muted" style="font-size:13px"><span>${p.promised?`твої ${uah(p.bal)} + батьки ${uah(p.promised)} = `:''}${uah(tot)} з ${uah(p.goal)}</span><span>${eta}</span></div></section>`;
}
const rw = it => it.reward != null ? `<span class="rw">+${it.reward} ₴</span>` : '';
const two = (act, h, done, dis, yes='✅ Виконав', no='❌ Не виконав') => `<span class="pick"><button data-act="${act}" data-h="${h}" data-v="1" aria-pressed="${done===true}"${dis}>${yes}</button><button data-act="${act}" data-h="${h}" data-v="0" aria-pressed="${done===false}"${dis}>${no}</button></span>`;
const box = it => `<span class="box">${it.done === true ? '✓' : it.done === false ? '✕' : (ICON[it.type] || '')}</span>`;
const cls = it => it.done === true ? 'ok' : it.done === false ? 'no' : '';
// ✅ Звички — дитина
function habitRowKid(it, k, view) {
  const dis = view ? ' disabled' : '', must = k.relaxed && it.must ? ' · обов\'язково і у вихідні' : '';
  const head = `<span class="t">${esc(it.t)}</span>${rw(it)}`;
  const sub = (txt) => `<br><span class="s">${esc(txt)}${must}</span>`;
  if (it.type === 'self') return `<div class="item ${cls(it)}">${box(it)}<span>${head}${sub(it.hint || it.status)}${it.can || view ? two('set', it.k, it.done, dis) : ''}</span></div>`;
  if (it.type === 'timed') return `<div class="item ${cls(it)}">${box(it)}<span>${head}${sub(it.status)}${it.can || view ? two('hw', it.k, it.done, dis) : ''}</span></div>`;
  if (it.type === 'screen') return `<div class="item ${cls(it)}">${box(it)}<span>${head}${sub(it.status)}${it.can || view ? two('screen', it.k, it.done, dis, '✅ Вклався', '❌ Ні') : ''}</span></div>`;
  if (it.type === 'auto') {
    if (it.can && it.late) return `<div class="item no">${box(it)}<span>${head}${sub(it.status)}<span class="pick"><button data-act="wake"${dis}>Зрозумів</button></span></span></div>`;
    if (it.can) return `<button class="item" data-act="wake"${dis}>${box(it)}<span>${head}${sub(it.status + ' · натисни, як прокинувся')}</span></button>`;
    return `<div class="item ${cls(it)}">${box(it)}<span>${head}${sub(it.status)}</span></div>`;
  }
  return `<div class="item ${cls(it)}">${box(it)}<span>${head}${sub(it.status + (it.hint ? ' · ' + it.hint : ''))}</span></div>`;
}
const fixOpen = new Set(); // «Виправити» розкрито для цих звичок
// ✅ Звички — батьки: дані дитини великим, «Виправити» — маленьке
function habitRowParent(it, d) {
  const head = `<span class="t">${esc(it.t)}</span>${rw(it)}`;
  const who = it.by === 'батьки' ? ' · виправили батьки' : '';
  if (it.type === 'self' || it.type === 'parent') {
    const hint = [it.hint, it.type === 'parent' ? it.status : (it.pressed ? 'відмітив сам' : it.done === null ? 'не відмічав' : who.replace(' · ', ''))].filter(Boolean).join(' · ');
    return `<div class="item ${cls(it)}">${box(it)}<span>${head}<br><span class="s">${esc(hint)}</span>${it.can ? two('pset', it.k, it.done, '') : ''}</span></div>`;
  }
  const stat = `<span class="stat ${cls(it)}">${esc(it.status)}</span>`;
  const note = it.type === 'screen' ? '<span class="s"> · оцінює сам</span>' : it.pressed ? '<span class="s"> · натиснув сам</span>' : it.done === null ? '' : `<span class="s">${who}</span>`;
  const fix = it.can && it.type !== 'screen' ? (fixOpen.has(it.k) ? two('pset', it.k, it.done, '') : `<br><button class="fix" data-act="fixopen" data-h="${it.k}">Виправити</button>`) : '';
  return `<div class="item ${cls(it)}">${box(it)}<span>${head}<br>${stat}${note}${fix}</span></div>`;
}
function habitsCard(k, mode) {
  const rows = k.items.map(it => mode === 'parent' ? habitRowParent(it, k) : habitRowKid(it, k, mode === 'view')).join('');
  const top = (k.approved ? '<div class="sub">🔒 Тиждень підтверджено</div>' : '') + (k.relaxed ? '<div class="note">🌴 Вихідний: усе за бажанням, крім ранкового маршруту й вечора</div>' : '');
  const pc = mode !== 'parent' && k.pc && k.date === k.today ? `<div class="sub">🖥 ПК сьогодні: ігри ${mins(k.pc.game)} · соцмережі ${mins(k.pc.social)} (бачиш тільки ти)</div>` : '';
  return `<section class="card" id="blk-habits"><div class="row"><h2>✅ Звички</h2><span class="sub">серія і бонуси</span></div>${top}${rows}${pc}${mode === 'parent' ? dayTasksHTML(k) + flexHTML(k) : ''}</section>`;
}
const DTS = {ok:'✅ зараховано', wait:'⏳ чекає', no:'❌ не зараховано', declined:'відмовився'};
function dayTasksHTML(k) {
  const L = (k.dayTasks||[]); if (!L.length) return '';
  return `<div class="lbl" style="margin-top:4px">🧹 Задачі за день</div>${L.map(x=>`<div class="nrow"><span class="tx">${esc(x.title)}<span class="k">${DTS[x.st]||''}${x.st==='ok'&&x.by?' · '+esc(x.by):''}${x.share&&x.share<1?' · частка '+Math.round(x.share*100)+'%':''}</span></span><span class="v num">${x.st==='ok'?'+'+uah(x.amount):''}</span></div>`).join('')}`;
}
function flexHTML(k) {
  if (!k.flex || !k.flex.length || k.approved) return '';
  return `<details id="blk-schedule"><summary>📅 Розклад цього дня</summary><div class="pick" style="margin:6px 0 0;flex-wrap:wrap">${k.flex.map(f=>`<button data-act="pflex" data-h="${f.k}" data-v="${f.on?0:1}">${f.on?'− '+esc(f.t):'+ '+esc(f.t)}</button>`).join('')}</div></details>`;
}
// 🧹 Задачі — дитина

  if (!tg || !tg.BackButton) return;
  const show = reviewMode || histOpen || preview;
  if (show) tg.BackButton.show(); else tg.BackButton.hide();
}
if (tg && tg.BackButton) tg.BackButton.onClick(() => { if (histOpen) histOpen = false; else if (preview) preview = false; else if (reviewMode) { reviewMode = false; reviewWeek = ''; } render(state); window.scrollTo(0,0); });
function render(j) {
  syncBack();
  const app = document.getElementById('app');
  if (j.error) { app.innerHTML = `<div class="err">${esc(j.error)}</div>`; return; }
  const t = toast ? `<div class="err">${esc(toast)}</div>` : ''; toast = '';
  const h = histOpen ? historyModal((j.role === 'parent' ? j.detail.history : j.history) || []) : '';
  app.innerHTML = t + (j.role === 'parent' ? parentHTML(j) : (j.note ? `<div class="note">${esc(j.note)}</div>` : '') + kidHTML(j, 'kid')) + h;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, v = b.dataset.v;
  // кнопки без запиту на сервер працюють завжди, навіть поки чекаємо відповіді
  const uiOnly = ['hist','histclose','fixopen','pamt','tmode','copen','preview','review','ntype'];
  if (busy && !uiOnly.includes(a)) return;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  if (a==='day') { date = v; call('app_state'); }
  if (a==='set') call('app_toggle', {habit:b.dataset.h, ok: v==='1'});
  if (a==='wake') call('app_wake');
  if (a==='hw') call('app_hw', {ok: v!=='0'});
  if (a==='screen') call('app_screen', {ok: v==='1'});
  if (a==='note') { const t = document.getElementById('note').value; if (t.trim().length > 1) call('app_note', {text: t}); }
  if (a==='hist') { histOpen = true; render(state); }
  if (a==='histclose') { histOpen = false; render(state); }
  if (a==='pkid') { pkid = v; preview = false; pamt = null; fixOpen.clear(); if (reviewMode && !reviewWeek) reviewWeek = state.detail.week.id; call('app_state'); }
  if (a==='pday') { date = v; reviewWeek = ''; fixOpen.clear(); call('app_state'); }
  if (a==='fixopen') { fixOpen.add(b.dataset.h); render(state); }
  if (a==='pset') { fixOpen.delete(b.dataset.h); call('app_p_toggle', {habit:b.dataset.h, ok: v==='1'}); }
  if (a==='pnews') call('app_p_news', {id:b.dataset.id, ok: v==='1'});
  if (a==='pamt') { pamt = Number(v); document.querySelectorAll('[data-act=pamt]').forEach(x=>x.setAttribute('aria-pressed', x===b)); }
  if (a==='psave') { const my = (state.detail.praise||{})[state.pkey]||{}, why = document.getElementById('why').value; drafts[state.detail.kid] = why; call('app_p_praise', {amt: pamt ?? (my.amt||0), why}); }
  if (a==='papprove') { if (b.dataset.confirm) call('app_p_approve'); else { b.dataset.confirm = '1'; b.textContent = 'Натисніть ще раз, щоб підтвердити'; } }
  if (a==='task') call('app_task_'+b.dataset.a, {id: b.dataset.id});
  if (a==='copen') { creditOpen = creditOpen === v ? '' : v; render(state); }
  if (a==='ptask') call('app_p_task_ok', {claim: b.dataset.id, ok: v==='1', how: b.dataset.how, share: Number(b.dataset.share||1)});
  if (a==='pflex') call('app_p_habit_day', {habit: b.dataset.h, on: v==='1'});
  if (a==='tmode') { tmode = v; document.querySelectorAll('[data-act=tmode]').forEach(x=>x.setAttribute('aria-pressed', x===b)); }
  if (a==='pcredit') { creditOpen = ''; call('app_p_task_credit', {id: b.dataset.id, kid: b.dataset.kid, share: Number(b.dataset.share||1)}); }
  if (a==='pcancel') { if (b.dataset.confirm) call('app_p_task_cancel', {id: b.dataset.id}); else { b.dataset.confirm = '1'; b.textContent = 'Точно?'; } }
  if (a==='pprice') call('app_p_chore_price', {id: b.dataset.id, price: Number(document.querySelector(`[data-cprice="${b.dataset.id}"]`).value)});
  if (a==='ppost') { const sel = document.getElementById('tsel'); call('app_p_task_post', {chore: sel.value || null, title: document.getElementById('ttitle').value, price: Number(document.getElementById('tprice').value), save: document.getElementById('tsave').checked, mode: tmode}); }
  if (a==='preview') { preview = v==='1'; render(state); window.scrollTo(0,0); }
  if (a==='review') { reviewMode = v==='1'; if (!reviewMode) { reviewWeek = ''; } render(state); window.scrollTo(0,0); if (b.dataset.scroll) { const el = document.getElementById('blk-'+b.dataset.scroll); if (el) el.scrollIntoView({block:'start'}); } }
  if (a==='rweek') { reviewWeek = v; date = null; call('app_state'); }
  if (a==='rcell') { if (!reviewWeek) reviewWeek = state.detail.week.id; call('app_p_toggle', {habit: b.dataset.h, ok: v==='1', date: b.dataset.d}); }
  if (a==='ntype') { newsType = v; document.querySelectorAll('[data-act=ntype]').forEach(x=>x.setAttribute('aria-pressed', x===b)); }
  if (a==='news') { const t = document.getElementById('newstext').value; if (t.trim().length > 1) call('app_news', {type: newsType, text: t}); }
});
// вибір задачі зі списку підставляє її ціну; поле назви — лише для свого завдання
document.addEventListener('change', e => {
  if (e.target.id !== 'tsel') return;
  const o = e.target.selectedOptions[0];
  document.getElementById('tprice').value = o.dataset.price || (state.tasks && state.tasks.def) || 20;
  document.getElementById('ttitle').style.display = e.target.value ? 'none' : '';
  if (o.dataset.mode) { tmode = o.dataset.mode; document.querySelectorAll('[data-act=tmode]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.v===tmode)); }
});
call('app_state');
</script>
