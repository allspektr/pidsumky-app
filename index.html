<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Підсумки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@600&display=swap">
<style>
:root{
  --bg:var(--tg-theme-secondary-bg-color,#EEF3F1); --card:var(--tg-theme-bg-color,#fff); --ink:var(--tg-theme-text-color,#13201B);
  --muted:var(--tg-theme-hint-color,#5C6E67); --accent:var(--tg-theme-button-color,#0B7F62); --accent-ink:var(--tg-theme-button-text-color,#fff);
  --line:color-mix(in srgb,var(--muted) 22%,transparent); --soft:color-mix(in srgb,var(--accent) 14%,transparent);
  --coin:#C98A00; --coin-soft:color-mix(in srgb,#E0A21B 18%,transparent); --bad:#C2462F;
  --f-d:"Unbounded","Manrope",system-ui,sans-serif; --f-b:"Manrope",system-ui,-apple-system,sans-serif; --f-m:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-b);padding:12px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2{font-family:var(--f-d);margin:0;letter-spacing:-.01em} h1{font-size:20px} h2{font-size:15px}
.card{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.num{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:7px;transition:width .6s}
.bar s{position:absolute;top:0;bottom:0;width:2px;background:var(--card)}
.big{font-family:var(--f-d);font-size:30px;color:var(--coin)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.seg button{font:700 14px var(--f-b);border:0;border-radius:10px;padding:10px;background:none;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.item{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--bg);border:0;text-align:left;font:inherit;color:inherit;width:100%}
.item .box{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--card);border:2px solid var(--line)}
.item.ok .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item.no .box{border-color:var(--bad);color:var(--bad)}
.item .t{font-weight:800} .item .s{font-size:12.5px;color:var(--muted)}
.item[disabled]{cursor:default} button.item:not([disabled]){cursor:pointer}
.pick{display:flex;gap:6px;margin-top:8px}.pick button{font:700 13px var(--f-b);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px}.pick button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cta{font:800 15px var(--f-b);border:0;border-radius:14px;padding:14px;background:var(--accent);color:var(--accent-ink);width:100%}
.lines .l{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.lines .l:last-child{border:0} .lines .v{font-family:var(--f-m)}
.streak{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.streak div{border-radius:12px;padding:8px;text-align:center;background:var(--bg);font-size:11px;color:var(--muted)}
.streak div b{display:block;font-family:var(--f-m);color:var(--coin);font-size:13px}
.streak div.on{background:var(--coin-soft)}
.wk{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px} .wk .v{font-family:var(--f-m);text-align:right}
.full{color:var(--coin);font-weight:800}
.empty{padding:24px;text-align:center;color:var(--muted)}
.err{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border-radius:14px;padding:12px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card empty">Завантажую…</div></div>
<script>
const API = 'https://jghlyjhpqherweplohrl.supabase.co/functions/v1/family-bot';
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
let state = null, date = null, busy = false;
const uah = n => Math.round(n).toLocaleString('uk-UA') + ' ₴';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mins = s => { const m = Math.round(s/60); return m >= 60 ? Math.floor(m/60)+' год '+(m%60)+' хв' : m+' хв'; };
const ICON = {auto:'☀️', self:'', timed:'📚', screen:'🎮', parent:'🌙'};

async function call(action, extra={}) {
  if (!tg || !tg.initData) { render({error:'Відкрийте цю сторінку з бота @Pidsumky_bot.'}); return; }
  busy = true;
  try {
    const r = await fetch(API, {method:'POST', headers:{'content-type':'application/json','x-tg-init-data':tg.initData}, body:JSON.stringify({action, date, ...extra})});
    const j = await r.json();
    if (!r.ok) { render({error: j.error==='not_member' ? 'Спершу підключіться до бота за посиланням-запрошенням.' : 'Не вдалося завантажити. Спробуйте ще раз.'}); return; }
    state = j; if (!date) date = j.today || null; render(j);
  } catch(e) { render({error:'Немає звʼязку із сервером. Перевірте інтернет.'}); }
  finally { busy = false; }
}

function goalCard(k) {
  const p = k.piggy;
  if (!p.goal) return `<section class="card"><div class="lbl">Скарбничка · ${esc(k.name)}</div><div class="big">${uah(p.bal)}</div><div class="muted">Ціль ще не обрана</div></section>`;
  const pct = Math.min(100, p.bal/p.goal*100), step = p.goal >= 20000 ? 10000 : 0, marks = [];
  if (step) for (let v = step; v < p.goal; v += step) marks.push(v);
  const pace = k.week.total * (1 + (p.match||0)/100), left = Math.max(0, p.goal - p.bal);
  return `<section class="card"><div class="row"><div><div class="lbl">${esc(k.name)} збирає на</div><h1>${esc(p.goal_name||'Ціль')}</h1></div><div class="num" style="font-size:18px;font-weight:600">${uah(p.bal)}<span class="muted" style="font-size:12px"> / ${uah(p.goal)}</span></div></div>
  <div class="bar"><i style="width:${pct}%"></i>${marks.map(v=>`<s style="left:${v/p.goal*100}%"></s>`).join('')}</div>
  <div class="row muted" style="font-size:13px"><span>${Math.round(pct)}%</span><span>${left===0?'Ціль досягнута! 🎉':pace>0?'≈ '+Math.ceil(left/pace)+' тиж. у такому темпі':''}</span></div></section>`;
}
function itemsHTML(k, interactive) {
  return k.items.map(it => {
    const cls = it.done === true ? 'ok' : it.done === false ? 'no' : '';
    const mark = it.done === true ? '✓' : it.done === false ? '✕' : (ICON[it.type] || '');
    const act = interactive && it.can ? (it.type==='self' ? `data-act="toggle" data-h="${it.k}"` : it.type==='auto' ? 'data-act="wake"' : it.type==='timed' ? 'data-act="hw"' : '') : '';
    const verb = interactive && it.can && it.type==='auto' ? ' · натисни, як прокинувся' : interactive && it.can && it.type==='timed' ? ' · натисни, як закінчиш' : '';
    if (interactive && it.can && it.type === 'screen') return `<div class="item ${cls}"><span class="box">${mark}</span><span><span class="t">${esc(it.t)}</span><br><span class="s">${esc(it.status)}</span><span class="pick"><button data-act="screen" data-v="1" aria-pressed="${it.done===true}">✅ Вклався</button><button data-act="screen" data-v="0" aria-pressed="${it.done===false}">❌ Ні</button></span></span></div>`;
    return `<button class="item ${cls}" ${act || 'disabled'}><span class="box">${mark}</span><span><span class="t">${esc(it.t)}</span><br><span class="s">${esc(it.status)}${verb}</span></span></button>`;
  }).join('');
}
function weekCard(k) {
  const w = k.week, lv = w.level;
  return `<section class="card"><div class="lbl">Цього тижня</div><div class="row"><span class="big">${uah(w.total)}</span><span class="muted">з ${uah(w.max)}</span></div>
  <div class="streak">${w.streak.map((v,i)=>`<div class="${w.clean&&lv===i?'on':''}"><b>+${v} ₴</b>${i===0?'1-й тиждень':i===1?'2-й поспіль':'3-й і далі'}</div>`).join('')}</div>
  <div class="muted" style="font-size:13px">${w.clean?`Пропусків ${w.misses} з 2 дозволених: серійний бонус поки твій 🔥`:`Пропусків ${w.misses}: серійний бонус цього тижня згорів`}</div>
  <div class="wk">${w.rows.map(r=>`<span>${esc(r.t)}</span><span class="v ${r.done===r.sch?'full':''}">${r.done}/${r.sch}</span>`).join('')}</div></section>`;
}
function render(j) {
  const app = document.getElementById('app');
  if (j.error) { app.innerHTML = `<div class="err">${esc(j.error)}</div>`; return; }
  if (j.role === 'parent') {
    app.innerHTML = `<div class="lbl" style="padding:0 4px">Батьківський огляд · ${esc(j.name)}</div>` + j.kids.map(k => `
      ${goalCard(k)}
      <section class="card"><div class="row"><h2>${esc(k.name)} сьогодні</h2></div>${itemsHTML(k,false)}
      ${k.pc?`<div class="muted" style="font-size:13px">ПК: ігри ${mins(k.pc.game)} · соцмережі ${mins(k.pc.social)} · навчання ${mins(k.pc.study)}</div>`:''}</section>
      ${weekCard(k)}`).join('') + `<div class="muted" style="font-size:13px;text-align:center">Похвала і підтвердження тижня — у чаті з ботом.</div>`;
    return;
  }
  const k = j, yday = (() => { const d = new Date(k.today+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()-1); return d.toISOString().slice(0,10); })();
  app.innerHTML = goalCard(k) + `
    <div class="seg"><button data-act="day" data-v="${k.today}" aria-pressed="${date===k.today}">Сьогодні</button><button data-act="day" data-v="${yday}" aria-pressed="${date===yday}">Вчора</button></div>
    <section class="card">${k.approved?'<div class="muted">🔒 Тиждень підтверджено</div>':''}${itemsHTML(k,true)}
    ${k.pc&&date===k.today?`<div class="muted" style="font-size:13px">🖥 Твій ПК сьогодні: ігри ${mins(k.pc.game)} · соцмережі ${mins(k.pc.social)} · навчання ${mins(k.pc.study)} (бачиш тільки ти)</div>`:''}</section>` + weekCard(k);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || busy) return;
  const a = b.dataset.act;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  if (a==='day') { date = b.dataset.v; call('app_state'); }
  if (a==='toggle') call('app_toggle', {habit:b.dataset.h});
  if (a==='wake') call('app_wake');
  if (a==='hw') call('app_hw');
  if (a==='screen') call('app_screen', {ok: b.dataset.v==='1'});
});
call('app_state');
</script>
</body>
</html>
